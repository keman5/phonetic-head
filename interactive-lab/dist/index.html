<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>发音解剖实验室 · 本地交互</title><link rel="stylesheet" href="./style.css"><script type="importmap">{"imports":{"three":"./vendor/three.module.js","three/addons/":"./vendor/addons/"}}</script></head>
<body>
<header><div class="identity"><span class="logo">ə</span><div><strong>发音解剖实验室</strong><small>看见嘴唇、舌头和肌肉的配合</small></div></div><span class="local">本地模型 · Z-Anatomy</span></header>
<main>
<aside class="lessons"><p class="eyebrow">选择一个音</p><div id="sounds"></div><div class="lesson-note"><span class="line-mark"></span><h2 id="sound-title"></h2><p id="sound-copy"></p><p class="tip" id="sound-tip"></p></div><div class="legend"><span><i class="muscle"></i>相关肌肉</span><span><i class="organ"></i>发音器官</span><span><i class="air"></i>气流方向</span></div></aside>
<section class="workspace" aria-label="三维模型和播放控制">
<div class="stage" id="stage"><div id="viewer" aria-label="可旋转和缩放的三维发音器官" tabindex="0"></div><div class="stage-top"><div class="view-buttons" aria-label="观察视角"><button data-view="oblique" class="chosen">斜视</button><button data-view="front">正面</button><button data-view="right">右侧</button><button data-view="left">左侧</button></div><button id="reset-view" class="quiet">重置视角</button></div><div id="load-state" role="status"><span class="spinner"></span><b>正在加载解剖模型</b><span id="load-detail">准备头颈与肌肉结构…</span><button id="retry" hidden>重新加载</button></div><div class="organ-pin" id="organ-pin" hidden></div><div class="stage-bottom"><span>拖动旋转 · 滚轮缩放 · 方向键转动</span><span id="air-status">气流待启动</span></div><div class="phase-chip"><i></i><span id="phase-label">准备动作</span></div></div>
<div class="transport"><div class="steps" id="steps"></div><div class="scrub"><input id="timeline" type="range" min="0" max="1000" step="1" value="0" aria-label="发音动作进度"><output id="time-label">0.0 / 6.0 秒</output></div><div class="play-row"><button id="play" class="primary" disabled>▶ 播放动作</button><button id="restart" class="quiet" disabled>从头开始</button><label class="speed">速度 <select id="speed" aria-label="播放速度"><option value="0.5">0.5 ×</option><option value="1" selected>1 ×</option><option value="1.5">1.5 ×</option></select></label><label><input id="loop" type="checkbox" checked> 循环</label><label><input id="air-toggle" type="checkbox" checked> 气流</label></div></div>
</section>
<aside class="controls"><div class="panel-heading"><h2>看进模型内部</h2><button id="reset-opacity" class="link-button">还原</button></div><p class="help">透明度越高，越能看见深层结构。左右以模型自身为准。</p><div class="presets"><button data-preset="cutaway" class="chosen">半侧剖开</button><button data-preset="xray">双侧透视</button><button data-preset="surface">完整外观</button></div>
<div class="side-control"><label for="left-alpha">模型左半侧 <output id="left-value">0%</output></label><input id="left-alpha" type="range" min="0" max="100" value="0"><label for="right-alpha">模型右半侧 <output id="right-value">100%</output></label><input id="right-alpha" type="range" min="0" max="100" value="100"><button id="swap-sides" class="swap">⇄ 交换左右透明度</button></div>
<div class="layers"><h3>各层透明度</h3><div id="layer-controls"></div></div>
<div class="muscles-panel"><h3>观察肌肉配合 <small>点击高亮</small></h3><div id="focus-list"></div><button id="clear-focus" class="link-button">取消高亮</button></div><div class="selection" id="selection"><strong>选择器官查看动作</strong><p>点击模型或上方列表，查看当前音中的运动。</p></div></aside>
</main>
<footer>解剖底模：<a href="https://github.com/LluisV/Z-Anatomy-Sample" target="_blank" rel="noreferrer">Z-Anatomy</a> · <a href="./assets/ATTRIBUTION.md">CC BY-SA 4.0</a><span>肌肉形变、声带慢动作与气流路径为教学动画，未经生物力学验证。</span></footer>
<script type="module" src="./app.js"></script></body></html>
