<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f8f9fb"><title>英语小课堂 · 学习中</title><link rel="stylesheet" href="./journey.css"><link rel="stylesheet" href="./voice-practice.css"><link rel="stylesheet" href="./navigation.css"><script type="module" src="./navigation.js"></script></head><body>
<header class="school-header"><div class="lesson-identity"><a href="./index.html">← 我的课程</a><strong id="lesson-name"></strong></div><nav class="site-navigation" aria-label="学习导航"></nav></header>
<main class="classroom"><aside class="chapter-rail"><p class="eyebrow">本课学习路线</p><nav id="chapters" aria-label="课程章节"></nav><p class="rail-note">不着急。每次只做一件事，<br>想再听一遍就再听一遍。</p></aside><section class="lesson-screen" aria-labelledby="screen-title"><div class="screen-heading"><p id="step-label" class="eyebrow"></p><span id="task-badge">一个小任务</span></div><h1 id="screen-title" tabindex="-1"></h1><p id="instruction" class="instruction"></p>
<div class="player-surface"><div class="player-heading"><span><i class="live-dot"></i> 示范课堂</span><span>听一听，再跟着说</span></div><div id="learning-modes" class="learning-modes" role="group" aria-label="学习模式"><button id="model-mode" disabled type="button" aria-pressed="true">3D 模型</button><button id="text-mode" disabled type="button" aria-pressed="false">图文与声音</button></div><div id="scene" class="story-scene"><span id="scene-icon" aria-hidden="true"></span><p id="scene-copy"></p></div>
<div id="model-panel" hidden><iframe id="model-frame" title="可以旋转观察的三维发音示范" allow="autoplay"></iframe></div>
<div id="reading" class="reading"><p id="reading-text" lang="en-GB"></p><p id="reading-meaning"></p></div>
<div id="media-controls" class="media-controls"><button id="demo" disabled type="button" class="primary">听老师示范</button><button id="pause" type="button" disabled>暂停</button><label>回看进度<input id="scrub" type="range" min="0" max="1000" value="0" aria-label="本节示范进度"></label><div class="demo-speed" role="group" aria-label="示范语速"><label for="demo-rate">示范语速 <output id="demo-rate-value" for="demo-rate">1×</output></label><input id="demo-rate" type="range" min="0.5" max="1.5" step="0.05" value="1" aria-describedby="demo-rate-help"><div class="demo-rate-presets"><button type="button" data-demo-rate="0.5">0.5×</button><button type="button" data-demo-rate="0.65">0.65×</button><button type="button" data-demo-rate="0.85">0.85×</button><button type="button" data-demo-rate="1">1×</button><button type="button" data-demo-rate="1.25">1.25×</button><button type="button" data-demo-rate="1.5">1.5×</button></div><small id="demo-rate-help">慢一点听清，熟悉后加速 · 播放中也能调整</small></div></div></div><p id="teacher-tip" class="teacher-tip"></p>
<div id="answers" class="answers" hidden></div>
<fieldset id="reflection" hidden aria-describedby="reflection-help"><legend>最后一步 · 完成自查</legend><p id="reflection-progress" role="status" aria-live="polite"></p><label><input type="checkbox"><span><strong>01　自己说一遍</strong><small>我已经尝试独立说出完整一句，不要求一次说准。</small></span></label><label><input type="checkbox"><span><strong>02　对照听一听</strong><small>我比较了示范，找到了想再练的地方。</small></span></label><div class="reflection-footer"><p id="reflection-help"></p><button id="review-listen" type="button">再听示范 / 看句子</button></div></fieldset>
<section id="voice-practice" hidden></section>
<p id="voice-coach-link" hidden><a class="text-link" href="./practice.html">想自由说一说？打开语音教练 ↗</a></p><div id="review" class="review" hidden></div><p id="feedback" class="feedback" role="status" aria-live="polite"></p><p id="storage-warning" hidden>本次浏览器无法保存进度，请先完成当前课程；刷新后可能需要重新开始。</p>
